<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{site}} for Unreal Engine</title>
<meta name="description" content="{{summary}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("bl-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body class="layout-{{bodyclass}}">
<header class="topbar">
  <button class="menu-toggle" aria-label="Open navigation">☰</button>
  <a class="brand" href="index.html"><img src="assets/mark.svg" alt=""><span>{{site}}</span><em>v{{version}}</em></a>
  <button class="search-open" aria-label="Search"><span>Search the docs</span><kbd>/</kbd></button>
  <nav class="top-links">
    <a href="getting-started.html">Get started</a>
    <a href="screens.html">Screens</a>
    <a href="{{repo}}/issues">Support</a>
    <button class="theme-toggle" aria-label="Switch light or dark theme">◐</button>
  </nav>
</header>
<div class="shell">
  <aside class="sidebar">{{nav}}</aside>
  <main class="content">
    <article>
      <div class="eyebrow">{{section}}</div>
      <h1>{{title}}</h1>
      {{content}}
      <nav class="pager">{{pager}}</nav>
    </article>
  </main>
  <aside class="toc"><div class="toc-title">On this page</div><nav></nav></aside>
</div>
<div class="search-panel" hidden>
  <div class="search-box">
    <input type="search" placeholder="Search guides, screens, classes…" aria-label="Search">
    <div class="search-results"></div>
    <div class="search-hint"><kbd>↑</kbd><kbd>↓</kbd> to move, <kbd>Enter</kbd> to open, <kbd>Esc</kbd> to close</div>
  </div>
</div>
<div class="lightbox" hidden><img alt=""><div class="lightbox-caption"></div></div>
<script src="assets/search-index.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
